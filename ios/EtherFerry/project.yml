# XcodeGen 工程定义
# 生成工程：brew install xcodegen && xcodegen generate
name: EtherFerry
options:
  bundleIdPrefix: cn.nordrassil
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  EtherFerry:
    type: application
    platform: iOS
    sources:
      - path: EtherFerry
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.nordrassil.etherferry
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EtherFerry/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/EtherFerry/Resources/EtherFerry-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: EtherFerry/Resources/Info.plist

schemes:
  EtherFerry:
    build:
      targets:
        EtherFerry: all
    run:
      config: Debug
    archive:
      config: Release
