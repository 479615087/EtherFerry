name: Build unsigned iOS IPA

# 在 GitHub 的免费 macOS 云主机上编译 iOS 应用，产出未签名 IPA。
# 未签名 IPA 下载到 Windows 后，用 Sideloadly / AltServer 用自己的 Apple ID 重签即可装到自己的 iPhone。

on:
  workflow_dispatch:          # 支持在 GitHub 网页上一键手动触发
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 主动选用镜像里最新的 Xcode（避免默认选中过旧版本打不开新工程格式）
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      # 优先下载 XcodeGen 官方发布包；下载后严格校验，失败自动回退 brew 安装
      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          rm -rf /tmp/xcodegen /tmp/xcodegen.zip
          if curl -fSL --retry 5 --retry-all-errors --connect-timeout 20 \
                -o /tmp/xcodegen.zip \
                https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip \
             && [ -s /tmp/xcodegen.zip ]; then
            unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
            find /tmp/xcodegen -maxdepth 3 -name xcodegen -type f || true
          fi
          XG_BIN=""
          for p in /tmp/xcodegen/bin/xcodegen /tmp/xcodegen/xcodegen/bin/xcodegen; do
            if [ -x "$p" ]; then XG_BIN="$p"; break; fi
          done
          if [ -z "$XG_BIN" ]; then
            echo "::warning::XcodeGen zip 下载/解压失败，回退到 brew 安装"
            brew install xcodegen
            XG_BIN="$(command -v xcodegen)"
          fi
          echo "$(dirname "$XG_BIN")" >> "$GITHUB_PATH"
          "$XG_BIN" --version

      - name: Generate Xcode project
        working-directory: ios/EtherFerry
        run: |
          set -euxo pipefail
          xcodegen generate
          ls -la

      - name: Archive without code signing
        working-directory: ios/EtherFerry
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EtherFerry.xcodeproj \
            -scheme EtherFerry \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/EtherFerry.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -40

      - name: Pack unsigned IPA
        working-directory: ios/EtherFerry
        run: |
          set -euxo pipefail
          rm -rf Payload build/ipa
          mkdir -p Payload build/ipa
          cp -R build/EtherFerry.xcarchive/Products/Applications/*.app Payload/
          zip -qry build/ipa/EtherFerry-unsigned.ipa Payload
          ls -lh build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EtherFerry-unsigned-ipa
          path: ios/EtherFerry/build/ipa/EtherFerry-unsigned.ipa
          retention-days: 90
