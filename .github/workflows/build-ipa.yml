name: Build unsigned iOS IPA

# 在 GitHub 的免费 macOS 云主机上编译 iOS 应用，产出未签名 IPA。
# 未签名 IPA 下载到 Windows 后，用 Sideloadly / AltServer 用自己的 Apple ID 重签即可装到自己的 iPhone。

on:
  workflow_dispatch:          # 支持在 GitHub 网页上一键手动触发
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      # 不用 brew（慢且易因网络失败），直接下载 XcodeGen 官方发布包
      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          curl -fsSL --retry 3 -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          ls -la /tmp/xcodegen
          echo "/tmp/xcodegen/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/xcodegen/bin:$PATH"
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios/EtherFerry
        run: |
          set -euxo pipefail
          export PATH="/tmp/xcodegen/bin:$PATH"
          xcodegen generate
          ls -la

      - name: Archive without code signing
        working-directory: ios/EtherFerry
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EtherFerry.xcodeproj \
            -scheme EtherFerry \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/EtherFerry.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -40

      - name: Pack unsigned IPA
        working-directory: ios/EtherFerry
        run: |
          set -euxo pipefail
          rm -rf Payload build/ipa
          mkdir -p Payload build/ipa
          cp -R build/EtherFerry.xcarchive/Products/Applications/*.app Payload/
          zip -qry build/ipa/EtherFerry-unsigned.ipa Payload
          ls -lh build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EtherFerry-unsigned-ipa
          path: ios/EtherFerry/build/ipa/EtherFerry-unsigned.ipa
          retention-days: 90
